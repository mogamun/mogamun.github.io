# Build and deploy the Gatsby site to GitHub Pages.
# Also scrapes GitHub Trending daily (and on every push) so /trending/ stays fresh.
name: Deploy Gatsby site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 00:27 UTC ≈ 09:27 KST — daily trending refresh
    - cron: "27 0 * * *"
  workflow_dispatch:

# contents: write → CI can commit the scraped trending data back to main
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: gatsby
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            public
            .cache
          key: ${{ runner.os }}-gatsby-build-${{ hashFiles('public') }}
          restore-keys: |
            ${{ runner.os }}-gatsby-build-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      # ── GitHub Trending 수집 ────────────────────────────────────────────
      - name: Cache scraper deps (playwright + chromium)
        uses: actions/cache@v4
        with:
          path: |
            scripts/trending/node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-trending-${{ hashFiles('scripts/trending/package-lock.json') }}
      - name: Scrape GitHub Trending
        working-directory: scripts/trending
        continue-on-error: true
        env:
          APP_TIMEZONE: Asia/Seoul
          TRENDING_SINCE: daily
        run: |
          npm install --no-audit --no-fund
          node scraper.js
      - name: Commit trending data (new day only)
        continue-on-error: true
        run: |
          OLD=$(git show HEAD:static/trending/latest.json 2>/dev/null \
            | sed -nE 's/.*"date"[[:space:]]*:[[:space:]]*"([0-9]{4}-[0-9]{2}-[0-9]{2})".*/\1/p' | head -1)
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "committed date=${OLD:-none}  today=$TODAY"
          if [ "$OLD" = "$TODAY" ]; then
            echo "오늘 데이터 이미 커밋됨 — 빌드는 방금 수집한 fresh 데이터 사용, 커밋은 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/trending/
          git commit -m "auto: trending $TODAY [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push || echo "push skipped"
      # ─────────────────────────────────────────────────────────────────────

      - name: Build with Gatsby
        env:
          PREFIX_PATHS: 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
