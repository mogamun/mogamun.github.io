<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="kit-title" content="배당 캘린더">
<meta name="kit-category" content="data">
<meta name="kit-description" content="한국 배당주 배당락일, 1주당 배당금 조회">
<meta name="kit-emoji" content="💰">
<title>배당 캘린더</title>
<style>
  :root {
    --bg: #0d0d1a;
    --surface: #1a1a2e;
    --surface2: #252540;
    --border: #2a2a4a;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #818cf8;
    --green: #22c55e;
    --red: #ef4444;
    --gold: #fbbf24;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f4ff;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-dim: #64748b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ===== TOOLBAR ===== */
  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-size: 16px;
    font-weight: 700;
    margin-right: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn {
    padding: 7px 14px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .search-box {
    flex: 1;
    min-width: 120px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .market-tabs { display: flex; gap: 4px; }
  .tab {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--text-dim);
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ===== SUMMARY ===== */
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    padding: 12px 16px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .summary-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
  .summary-value { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .summary-value.green { color: var(--green); }
  .summary-value.accent { color: var(--accent); }
  .summary-value.gold { color: var(--gold); }

  /* ===== TABLE ===== */
  .table-wrap {
    flex: 1;
    overflow-x: auto;
    padding: 0 16px 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid var(--border);
    color: var(--text-dim);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  th:hover { color: var(--accent); }
  th .sort { font-size: 10px; margin-left: 2px; opacity: 0.4; }
  th.sorted .sort { opacity: 1; color: var(--accent); }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tr:hover td { background: var(--surface2); }
  .stock-name {
    font-weight: 700;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .stock-code { font-size: 11px; color: var(--text-dim); font-weight: 400; }
  .dps { font-weight: 700; color: var(--gold); }
  .date-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(129,140,248,0.1);
    color: var(--accent);
  }
  .date-tag.upcoming { background: rgba(34,197,94,0.15); color: var(--green); }
  .date-tag.past { background: rgba(148,163,184,0.1); color: var(--text-dim); }
  .dividend-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .dividend-event {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .dividend-event .ev-date { color: var(--accent); font-weight: 600; }
  .dividend-event .ev-dps { color: var(--gold); font-weight: 700; }
  .dividend-event.next { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); }
  .dividend-event.next .ev-date { color: var(--green); }
  .dividend-event.past { opacity: 0.5; }
  .market-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }
  .market-badge.kospi { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .market-badge.kosdaq { background: rgba(168,85,247,0.15); color: #c084fc; }

  /* ===== LOADING ===== */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state { text-align: center; padding: 40px 20px; color: var(--red); }
  .error-state .retry { margin-top: 16px; }

  /* ===== INFO ===== */
  .info-bar {
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  @media (max-width: 600px) {
    .toolbar { padding: 8px 10px; gap: 6px; }
    .summary { padding: 8px 10px; }
    .table-wrap { padding: 0 8px 12px; }
    table { font-size: 12px; }
    th, td { padding: 6px 6px; }
    .dividend-row { gap: 6px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">💰 한국 배당주</span>
  <div class="market-tabs">
    <button class="tab active" data-mkt="ALL" onclick="setMarket('ALL')">전체</button>
    <button class="tab" data-mkt="코스피" onclick="setMarket('코스피')">코스피</button>
    <button class="tab" data-mkt="코스닥" onclick="setMarket('코스닥')">코스닥</button>
  </div>
  <input class="search-box" id="searchInput" placeholder="종목명 검색..." oninput="filterAndRender()">
  <button class="btn btn-primary" id="btnFetch" onclick="fetchData()">조회</button>
</div>

<div class="summary" id="summary"></div>
<div class="table-wrap" id="tableWrap">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p>조회 버튼을 눌러 배당 데이터를 불러오세요</p>
  </div>
</div>

<div class="info-bar" id="infoBar">
  <span>데이터: 네이버 증권 | 배당락일 기준</span>
  <span id="updateTime"></span>
</div>

<script>
let allStocks = [];
let filteredStocks = [];
let currentMarket = 'ALL';
let currentSort = { key: '_nextDate', dir: 'asc' };
const TODAY = new Date().toISOString().slice(0, 10);

async function fetchData() {
  const btn = document.getElementById('btnFetch');
  const wrap = document.getElementById('tableWrap');
  btn.disabled = true;
  wrap.innerHTML = '<div class="loading"><div class="spinner"></div><p>배당 데이터 로딩 중...</p></div>';

  try {
    const resp = await fetch('/kit/dividend-data.json');
    if (!resp.ok) throw new Error('데이터 파일을 불러올 수 없습니다');
    const data = await resp.json();
    if (!data.stocks || !data.stocks.length) throw new Error('데이터가 비어 있습니다');

    allStocks = data.stocks;
    document.getElementById('updateTime').textContent = '업데이트: ' + (data.updated || '');
    filterAndRender();
  } catch (e) {
    wrap.innerHTML = '<div class="error-state">' +
      '<p style="font-size:18px;margin-bottom:8px">데이터 로딩 실패</p>' +
      '<p style="color:var(--text-dim);font-size:13px">' + escHtml(e.message) + '</p>' +
      '<button class="btn btn-primary retry" onclick="fetchData()">다시 시도</button></div>';
  } finally {
    btn.disabled = false;
  }
}

function filterAndRender() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  filteredStocks = allStocks.filter(s => {
    if (currentMarket !== 'ALL' && s.market !== currentMarket) return false;
    return !q || s.name.toLowerCase().includes(q) || s.code.includes(q);
  });
  applySort();
  renderSummary();
  renderTable();
}

function applySort() {
  const { key, dir } = currentSort;
  filteredStocks.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (typeof va === 'string') return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return dir === 'asc' ? va - vb : vb - va;
  });
}

function getNextDate(stock) {
  for (const d of stock.dividends) {
    if (d.date >= TODAY) return d.date;
  }
  return stock.dividends[stock.dividends.length - 1].date;
}

function getNextDps(stock) {
  for (const d of stock.dividends) {
    if (d.date >= TODAY) return d.dps;
  }
  return stock.dividends[stock.dividends.length - 1].dps;
}

function getTotalDps(stock) {
  return stock.dividends.reduce((s, d) => s + d.dps, 0);
}

function renderSummary() {
  const el = document.getElementById('summary');
  if (!filteredStocks.length) { el.innerHTML = ''; return; }

  const total = filteredStocks.length;
  const nextDates = filteredStocks.map(s => getNextDate(s)).filter(d => d >= TODAY);
  const soonest = nextDates.length ? nextDates.sort()[0] : '-';

  const allEvents = filteredStocks.flatMap(s => s.dividends);
  const futureEvents = allEvents.filter(d => d.date >= TODAY);
  const maxDps = Math.max(...futureEvents.map(d => d.dps), 0);

  el.innerHTML = `
    <div class="summary-card">
      <div class="summary-label">배당주 수</div>
      <div class="summary-value accent">${total}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">가장 빠른 배당락일</div>
      <div class="summary-value green" style="font-size:15px">${soonest}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">남은 배당 이벤트</div>
      <div class="summary-value gold">${futureEvents.length}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">최고 1주당 배당금</div>
      <div class="summary-value gold">${maxDps.toLocaleString()}원</div>
    </div>
  `;
}

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if (!filteredStocks.length) {
    wrap.innerHTML = '<div class="loading"><p>데이터를 불러오세요</p></div>';
    return;
  }

  const rows = filteredStocks.slice(0, 150);
  wrap.innerHTML = `<table>
    <thead><tr>
      <th data-key="name">종목 <span class="sort">↕</span></th>
      <th data-key="close">종가 <span class="sort">↕</span></th>
      <th data-key="_totalDps">연간 배당금 <span class="sort">↕</span></th>
      <th data-key="_nextDate" class="sorted">다음 배당락일 <span class="sort">▲</span></th>
      <th data-key="_nextDps">1주당 배당금 <span class="sort">↕</span></th>
      <th>전체 배당 일정</th>
    </tr></thead>
    <tbody>${rows.map(s => {
      s._nextDate = getNextDate(s);
      s._nextDps = getNextDps(s);
      s._totalDps = getTotalDps(s);

      const mktClass = s.market === '코스피' ? 'kospi' : 'kosdaq';
      const isNext = s._nextDate >= TODAY;
      const dateClass = isNext ? 'upcoming' : 'past';

      const events = s.dividends.map(d => {
        const past = d.date < TODAY;
        const next = d.date === s._nextDate && isNext;
        return `<span class="dividend-event${next ? ' next' : ''}${past ? ' past' : ''}">
          <span class="ev-date">${d.date}</span>
          <span class="ev-dps">${d.dps.toLocaleString()}원</span>
        </span>`;
      }).join('');

      return `<tr>
        <td><div class="stock-name">
          ${escHtml(s.name)}
          <span><span class="stock-code">${s.code}</span> <span class="market-badge ${mktClass}">${s.market}</span></span>
        </div></td>
        <td>${s.close.toLocaleString()}원</td>
        <td class="dps">${s._totalDps.toLocaleString()}원</td>
        <td><span class="date-tag ${dateClass}">${s._nextDate}</span></td>
        <td class="dps">${s._nextDps.toLocaleString()}원</td>
        <td><div class="dividend-row">${events}</div></td>
      </tr>`;
    }).join('')}</tbody>
  </table>
  ${filteredStocks.length > 150 ? `<div style="text-align:center;padding:12px;color:var(--text-dim);font-size:12px">상위 150개 표시 (전체 ${filteredStocks.length}개)</div>` : ''}`;

  wrap.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (currentSort.key === key) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      else { currentSort.key = key; currentSort.dir = 'asc'; }
      applySort();
      renderTable();
    });
  });
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function setMarket(m) {
  currentMarket = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mkt === m));
  if (allStocks.length) filterAndRender();
}

fetchData();
</script>
</body>
</html>
